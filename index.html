<style>

.shell{display:flex;min-height:100vh}.shell.col aside{display:none}
aside{width:228px;flex-shrink:0;background:#000;border-right:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column}
.logo{color:#fff;font-weight:600;font-size:17px;line-height:1.1;padding:0 18px 16px;letter-spacing:.6px}

aside button:hover{background:#141416;color:#fff}aside button.on{background:#1c1c20;color:#fff}aside button.on svg{color:var(--brand)}
.bot{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}

.wrap{overflow-x:auto}

button.pri{background:var(--brand);color:#fff;border:0;cursor:pointer}
button.lk{background:none;border:0;color:var(--brand);padding:0;cursor:pointer;text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stats .card{margin:0}
.stat span{display:block;color:var(--mute);font-size:13px}.stat b{font-size:24px;font-weight:500}
.mute{color:var(--mute)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}.dash>div .card:last-child{margin-bottom:0}
.wh{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;gap:4px 0}.cal b{color:var(--mute);font-weight:500}
.cal em{font-style:normal;background:var(--brand);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;display:block;margin:auto}
.nw{padding:8px 0;border-top:1px solid var(--line);font-size:13px}.ck{display:flex;gap:8px;font-size:13px;padding:2px 0}
.pb{height:8px;background:var(--tint);border-radius:4px;overflow:hidden}.pb div{height:100%;background:var(--brand)}
.chart{display:flex;align-items:stretch;gap:6px;height:170px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute)}
.plot{flex:1;width:100%;display:flex;align-items:flex-end}.plot div{width:100%;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}
.rk{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar form{display:flex;gap:8px;flex:1;min-width:180px}.bar input{flex:1}
.chip{padding:4px 14px;border-radius:16px;cursor:pointer;font-size:14px}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--mute)}.pager button:disabled{opacity:.4}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.f label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}.f input,.f select{width:100%}
.login{max-width:400px;margin:50px auto;padding:0 16px}.login input{width:100%}.big{font-size:24px;font-weight:700;letter-spacing:.8px;text-align:center;margin-bottom:16px}
@media (max-width:720px){.shell{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;padding:6px}.logo,.sq{display:none}.bot{margin:0;border:0;display:flex;padding:0}aside button{width:auto;padding:8px 12px}}
.pres{font-size:18px}.pres .stat b{font-size:38px}.pres main{max-width:1320px}.pres .ptitle h1{font-size:32px}.pres th,.pres td{padding:12px 12px}
.act{white-space:nowrap}.act button{padding:3px 10px;font-size:13px;cursor:pointer}.act .dl{color:var(--err);border-color:var(--err)}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
</style></head>
